# Copy to tunnel-profile.yaml (git-ignored) and replace every <...> placeholder.
# <LAB_DIR> is the absolute path of this folder, written with forward slashes,
# e.g. D:/mcp/windows-agent-mcp-lab/browser-mcp-lab
config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  tunnel_id: "<tunnel_ID>"
  # The Runtime API key stays in secrets/ (git-ignored); only its path is referenced here.
  api_key: "file:<LAB_DIR>/secrets/openai-tunnel-key.txt"
  max_inflight_requests: 2
health:
  listen_addr: "127.0.0.1:0"
  url_file: "<LAB_DIR>/runtime/health.url"
admin_ui:
  open_browser: false
  log_buffer_events: 200
log:
  level: warn
  format: json
mcp:
  max_concurrent_requests: 1
  commands:
    - channel: main
      command: '"<PATH_TO>/node.exe" "<LAB_DIR>/server.mjs"'
